AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Customer Support Chatbot tool stack.
  DynamoDB ticket store + create_bug_report Lambda + the three IAM roles
  needed by AgentCore (Harness, Gateway, Lambda). Resource names follow the
  CloudFormation stack name so they match the documented screenshots
  (e.g. bug-report-tool-stack-bug-reports).

Parameters:
  ModelId:
    Type: String
    Default: 'us.amazon.nova-pro-v1:0'
    Description: Bedrock model ID the harness is allowed to invoke.

Resources:

  BugReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-bug-reports
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticketId
          AttributeType: S
      KeySchema:
        - AttributeName: ticketId
          KeyType: HASH

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBPutItem
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt BugReportsTable.Arn

  CreateBugReportFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaExecutionRole
    Properties:
      FunctionName: !Sub ${AWS::StackName}-create_bug_report
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref BugReportsTable
      Code:
        ZipFile: |
          import json, os, uuid
          from datetime import datetime, timezone
          import boto3

          table = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])

          def lambda_handler(event, _):
              print("EVENT:", json.dumps(event, indent=2, default=str))
              if event.get("messageVersion") != "1.0" or event.get("function") != "create_bug_report":
                  return _resp(event, {"error": "unsupported"})
              params = event.get("parameters") or []
              body = {p.get("name"): p.get("value") for p in params if isinstance(p, dict) and p.get("name") is not None}
              description = (body.get("description") or "").strip()
              steps = (body.get("stepsToReproduce") or "").strip()
              environment = (body.get("environment") or "").strip()
              if not description:
                  return _resp(event, {"error": "missing", "field": "description"})
              ticket_id = str(uuid.uuid4())
              item = {
                  "ticketId": ticket_id,
                  "description": description,
                  "stepsToReproduce": steps,
                  "environment": environment,
                  "status": "OPEN",
                  "createdAt": datetime.now(timezone.utc).isoformat(),
              }
              table.put_item(Item=item)
              return _resp(event, {"ticketId": ticket_id, "status": "OPEN"})

          def _resp(event, obj):
              return {
                  "messageVersion": "1.0",
                  "response": {
                      "actionGroup": event.get("actionGroup"),
                      "function": event.get("function"),
                      "functionResponse": {"responseBody": {"TEXT": {"body": json.dumps(obj)}}},
                  },
              }

  BedrockInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt CreateBugReportFunction.Arn
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com

  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-gateway-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CreateBugReportFunction.Arn

  HarnessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-harness-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeBedrockModel
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/*
        - PolicyName: AgentCoreGatewayInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:GetGateway
                  - bedrock-agentcore:ListGateways
                  - bedrock-agentcore:ListGatewayTargets
                  - bedrock-agentcore:GetGatewayTarget
                  - bedrock-agentcore:InvokeGateway
                Resource: '*'

Outputs:
  StackNameValue:
    Description: Echoes the stack name so setup scripts can derive resource names.
    Value: !Ref AWS::StackName
  BugReportsTableName:
    Description: Name of the DynamoDB tickets table.
    Value: !Ref BugReportsTable
  LambdaFunctionArn:
    Description: ARN of the create_bug_report Lambda function.
    Value: !GetAtt CreateBugReportFunction.Arn
  LambdaExecutionRoleArn:
    Description: ARN of the Lambda execution IAM role.
    Value: !GetAtt LambdaExecutionRole.Arn
  GatewayRoleArn:
    Description: ARN assumed by AgentCore Gateway to invoke the Lambda.
    Value: !GetAtt GatewayRole.Arn
  HarnessRoleArn:
    Description: ARN assumed by the AgentCore Harness to call Bedrock models.
    Value: !GetAtt HarnessRole.Arn